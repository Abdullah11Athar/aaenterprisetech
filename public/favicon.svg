<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#9333ea" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Icon Container -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="#090d1f" />
  
  <!-- Sleek AA Monogram -->
  <text x="50%" y="58%" font-family="system-ui, -apple-system, sans-serif" font-size="220" font-weight="900" fill="url(#brandGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-8">AA</text>
  
  <!-- Tech Accent Dot -->
  <circle cx="390" cy="140" r="24" fill="#a855f7" filter="url(#glow)" />
</svg>
